# DormDesk — web-01 (public subnet). The ONLY entry point for users.
# 45.77.40.35:10201 (lab port mapping) -> web-01:443

limit_req_zone $binary_remote_addr zone=dd_api:10m    rate=10r/s;  # general API
limit_req_zone $binary_remote_addr zone=dd_login:10m  rate=5r/m;   # login
limit_req_zone $binary_remote_addr zone=dd_report:10m rate=3r/m;   # new requests ≈ 30 / 10 min per IP (outer layer)
limit_req_status 429;

# never write room codes / tracking tokens into the access log
map $request_uri $dd_masked_uri {
    ~^/r/                  "/r/***";
    ~^/t/                  "/t/***";
    ~^/api/rooms/          "/api/rooms/***";
    ~^/api/track/          "/api/track/***";
    default                $request_uri;
}
log_format dormdesk '$remote_addr [$time_local] "$request_method $dd_masked_uri" $status $body_bytes_sent '
                    'rt=$request_time up=$upstream_addr "$http_user_agent"';

# The lab host drops public<->private traffic, so the API is reached through an SSH tunnel via the bastion
# (infra/remote/tunnel.sh):  127.0.0.1:8001 -> api-01:8000 · 127.0.0.1:8002 -> api-02:8000
upstream dd_api {
    server 127.0.0.1:8001 max_fails=2 fail_timeout=10s;     # api-01
    server 127.0.0.1:8002 max_fails=2 fail_timeout=10s;     # api-02
    keepalive 16;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:dd_ssl:5m;

    server_tokens off;
    absolute_redirect off;   # behind port mapping 10201->443: keep redirects relative
    # someone typed http:// on the HTTPS port -> send them to https (nginx code 497)
    error_page 497 =301 https://$http_host$request_uri;
    client_max_body_size 5m;
    access_log /var/log/nginx/access.log dormdesk;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    if ($request_method !~ ^(GET|HEAD|POST|PATCH)$) { return 405; }

    root /usr/share/nginx/html;

    location = /       { try_files /index.html =404; }
    location = /admin  { try_files /admin.html =404; }
    location /r/       { try_files /r.html =404; }
    location /t/       { try_files /t.html =404; }
    location /assets/  { expires 1h; }
    location = /favicon.ico { return 301 /assets/favicon.svg; }
    location ~ \.html$ { internal; }   # pages only via the clean URLs above

    location = /api/auth/login {
        limit_req zone=dd_login burst=3 nodelay;
        include /etc/nginx/conf.d/dd_proxy.inc;
    }
    location ~ ^/api/rooms/[^/]+/requests$ {
        limit_req zone=dd_report burst=5 nodelay;
        include /etc/nginx/conf.d/dd_proxy.inc;
    }
    location /api/ {
        limit_req zone=dd_api burst=20 nodelay;
        include /etc/nginx/conf.d/dd_proxy.inc;
    }
}
