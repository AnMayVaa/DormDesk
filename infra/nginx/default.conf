# DormDesk — web-01 (public subnet). The ONLY entry point for users.
# 45.77.40.35:10201 (lab port mapping) -> web-01:443

limit_req_zone $binary_remote_addr zone=dd_api:10m    rate=10r/s;  # general API
limit_req_zone $binary_remote_addr zone=dd_login:10m  rate=5r/m;   # login
limit_req_zone $binary_remote_addr zone=dd_report:10m rate=3r/m;   # new requests ≈ 30 / 10 min per IP (outer layer)
# v2 tenant WRITES (check-in, booking, parking, slips, messages): only POSTs are counted (empty key = not limited)
map $request_method $dd_write_key { POST $binary_remote_addr; default ""; }
limit_req_zone $dd_write_key       zone=dd_write:10m  rate=20r/m;
# load test only: a secret header (set by tools/loadtest/run.sh, off by default) skips the per-IP API limit
map $http_x_dd_loadtest $dd_api_key { default $binary_remote_addr; include /etc/nginx/conf.d/dd_loadtest.map*; }
limit_req_zone $dd_api_key         zone=dd_api_lt:10m rate=10r/s;
limit_req_status 429;

# never write room codes / tracking tokens / QR tokens into the access log
map $request_uri $dd_masked_uri {
    ~^/r/                  "/r/***";
    ~^/t/                  "/t/***";
    ~^/q/                  "/q/***";
    ~^/api/rooms/          "/api/rooms/***";
    ~^/api/track/          "/api/track/***";
    default                $request_uri;
}
log_format dormdesk '$remote_addr [$time_local] "$request_method $dd_masked_uri" $status $body_bytes_sent '
                    'rt=$request_time up=$upstream_addr "$http_user_agent"';

# The lab host drops public<->private traffic, so the API is reached through an SSH tunnel via the bastion
# (infra/remote/tunnel.sh). The upstream list is GENERATED from infra/topology.env (api-N auto-wiring):
#   127.0.0.1:8001 -> api-01:8000 · 127.0.0.1:8002 -> api-02:8000 · 127.0.0.1:800N -> api-0N:8000
include /etc/nginx/conf.d/dd_upstream.inc;

server {
    listen 443 ssl;
    http2 on;
    server_name dormdesk-g02.duckdns.org _;

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:dd_ssl:5m;

    server_tokens off;
    absolute_redirect off;   # behind port mapping 10201->443: keep redirects relative
    # someone typed http:// on the HTTPS port -> send them to https (nginx code 497)
    error_page 497 =301 https://$http_host$request_uri;
    client_max_body_size 5m;
    access_log /var/log/nginx/access.log dormdesk;

    include /etc/nginx/conf.d/dd_headers.inc;

    if ($request_method !~ ^(GET|HEAD|POST|PATCH|PUT)$) { return 405; }
    # canonical host: the trusted certificate is for dormdesk-g02.duckdns.org, so send IP visitors there
    if ($host != "dormdesk-g02.duckdns.org") { return 301 https://dormdesk-g02.duckdns.org:10201$request_uri; }

    include /etc/nginx/conf.d/dd_locations.inc;
}
