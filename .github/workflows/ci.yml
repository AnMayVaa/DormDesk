# DormDesk CI — runs on every push and pull request. Same database schema, same object store, same API code
# as the lab, so a change that breaks isolation, idempotency, bills or the object store fails here first.
# (CI-only credentials below are throw-away values for this job's containers — not the lab's secrets.)
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    name: Lint + config checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Python compiles
        run: python -m py_compile api/app/*.py tools/*.py infra/grafana/build.py
      - name: JavaScript syntax
        run: for f in web/assets/*.js; do node --check "$f"; done
      - name: Shell scripts (syntax + shellcheck errors)
        run: |
          for f in $(git ls-files '*.sh'); do bash -n "$f"; done
          shellcheck -S error $(git ls-files '*.sh')
      - name: Grafana files are up to date
        run: python3 infra/grafana/build.py && git diff --exit-code infra/grafana/
      - name: Nginx config (generated upstream + includes) passes nginx -t
        run: |
          mkdir -p /tmp/ng/conf.d /tmp/ng/tls
          cp infra/nginx/default.conf infra/nginx/*.inc /tmp/ng/conf.d/
          bash -c '. infra/topology.sh && dd_upstream' > /tmp/ng/conf.d/dd_upstream.inc
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=ci -keyout /tmp/ng/tls/server.key -out /tmp/ng/tls/server.crt 2>/dev/null
          docker run --rm -v /tmp/ng/conf.d:/etc/nginx/conf.d:ro -v /tmp/ng/tls:/etc/nginx/tls:ro nginx:1.29-alpine nginx -t

  tests:
    name: End-to-end tests (PostgreSQL 16 + SeaweedFS + API)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: ci }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Python dependencies
        run: python -m pip install -q -r api/requirements.txt
      - name: Object store (SeaweedFS S3)
        run: |
          docker run -d --name s3 -p 8333:8333 -v "$PWD/tools/ci:/cfg:ro" chrislusf/seaweedfs:4.48 \
            server -s3 -s3.config=/cfg/s3.json -s3.port.iceberg=0 -s3.port.lance=0 -master.volumeSizeLimitMB=64 -volume.max=4
          for i in $(seq 1 30); do sleep 2; echo "s3.bucket.create -name dormdesk" | docker exec -i s3 weed shell 2>/dev/null | grep -q "created\|exist" && break; done
      - name: Database (01 schema -> 02 features -> 03 security) + demo data
        run: |
          psql -c "CREATE DATABASE dormdesk"
          psql -v ON_ERROR_STOP=1 -d dormdesk -f db/01_schema.sql -f db/02_features.sql
          psql -v ON_ERROR_STOP=1 -v app_pw=ci_app -v ro_pw=ci_ro -v repl_pw=ci_repl -d dormdesk -f db/03_security.sql
          psql -v ON_ERROR_STOP=1 -d dormdesk -f db/02_features.sql -f db/03_security.sql -v app_pw=ci_app -v ro_pw=ci_ro -v repl_pw=ci_repl  # idempotent
          python3 tools/seed_gen.py --base-url http://127.0.0.1:8000
          psql -q -v ON_ERROR_STOP=1 -d dormdesk -f db/seed.generated.sql
      - name: Start the API
        run: |
          cd api
          export DATABASE_URL='postgresql://dormdesk_app:ci_app@localhost:5432,localhost:5433/dormdesk?target_session_attrs=read-write&connect_timeout=3'
          export SESSION_SECRET=$(python -c 'import secrets; print(secrets.token_hex(32))') COOKIE_SECURE=0 \
                 PUBLIC_BASE_URL=http://127.0.0.1:8000 S3_URL=http://127.0.0.1:8333 S3_ACCESS_KEY=ciapikey S3_SECRET_KEY=ciapisecret \
                 OBJ_KEYS="k1:$(python -c 'import os,base64; print(base64.b64encode(os.urandom(32)).decode())')" OBJ_KEY_ID=k1
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do sleep 1; curl -sf 127.0.0.1:8000/api/health && exit 0; done; cat /tmp/api.log; exit 1
      - name: v1 smoke test (16 checks)
        run: python3 tools/smoke_test.py http://127.0.0.1:8000
      - name: v2 flow test (tenancy, bills/slips/receipts, fines, parking, booking, check-in, idempotency, isolation)
        run: python3 tools/flow_test.py http://127.0.0.1:8000
      - name: Object backup round trip (read-only backup identity)
        run: |
          cd api
          S3_URL=http://127.0.0.1:8333 S3_ACCESS_KEY=cibackupkey S3_SECRET_KEY=cibackupsecret python -m app.objbackup dump > /tmp/o.tar
          python -m app.objbackup verify < /tmp/o.tar
      - name: API log on failure
        if: failure()
        run: tail -100 /tmp/api.log
