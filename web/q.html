<body>
<header class="topbar"><div class="container narrow">
  <a class="brand" href="/"><span class="brand-mark"><i data-icon="home"></i></span><span class="brand-text">Dorm<span>Desk</span></span></a>

    <div class="success-mark"><i data-icon="scan"></i></div>
    <h1 class="mt-0">เปิดลิงก์ห้องของคุณ แล้วสแกนจากเมนูนั้น</h1>
    <p class="muted">QR นี้ใช้เช็กอินหรือยืนยันการจองของหอพัก ต้องสแกนจากในลิงก์ห้องของคุณเท่านั้น ระบบจึงรู้ว่าเป็นห้องไหน</p>
    <ol class="small muted mt-2 left-list">
      <li>เปิดลิงก์ห้องที่เจ้าของหอส่งให้ (เช่นใน LINE)</li>
      <li>แตะเมนู "ส่วนกลาง"</li>
      <li>แตะ "สแกน QR" แล้วเล็งที่ QR นี้อีกครั้ง</li>
    </ol>
  </section>
